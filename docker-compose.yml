version: "3.9"

services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER}", "-p${DB_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 5

  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      PENDING_DIR: /data/downloads/pending
      SQLITE_PATH: /data/crawler_tasks.db
      CRAWLER_CONCURRENCY: ${CRAWLER_CONCURRENCY:-2}
      CRAWLER_REQUEST_INTERVAL_MS: ${CRAWLER_REQUEST_INTERVAL_MS:-3000}
      CRAWLER_REQUEST_INTERVAL_MAX_MS: ${CRAWLER_REQUEST_INTERVAL_MAX_MS:-10000}
      CRAWLER_PROXY: ${CRAWLER_PROXY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./data:/data
    depends_on:
      mysql:
        condition: service_healthy
    profiles:
      - full

  parser:
    build:
      context: .
      dockerfile: parser/Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      PENDING_DIR: /data/downloads/pending
      PROCESSING_DIR: /data/downloads/processing
      DONE_DIR: /data/downloads/done
      FAILED_DIR: /data/downloads/failed
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WATCHER_POLL_INTERVAL: ${WATCHER_POLL_INTERVAL:-5}
    volumes:
      - ./data/downloads:/data/downloads
    depends_on:
      mysql:
        condition: service_healthy
    profiles:
      - full

volumes:
  mysql_data:
